services:
  backend:
    build:
      context: ./backend
    environment:
      UPLOAD_DIR: /app/storage/batches
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ./storage/batches:/app/storage/batches

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_BACKEND_PROXY_TARGET: http://backend:8000
      VITE_API_BASE_URL: ""
    ports:
      - "5173:5173"
    depends_on:
      - backend
